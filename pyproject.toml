[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-pca-search"
version = "1.0.0"
description = "Exact nearest-neighbor search via composable PCA and triangle-inequality lower-bound pruning, with a measured prunability diagnostic"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tai-Wu Chiang", email = "taiwuchiang@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = [
    "nearest-neighbor-search",
    "exact-search",
    "pca",
    "branch-and-bound",
    "similarity-search",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# scikit-learn speeds up the k-means fit in hybrid_search (a pure-numpy
# Lloyd fallback is built in); matplotlib enables diagnose.py --plot;
# joblib/tqdm are used only by the benchmark.py reproduction script.
full = ["scikit-learn", "matplotlib", "joblib", "tqdm"]
test = ["pytest", "scikit-learn"]

[project.scripts]
pca-diagnose = "diagnose:main"

[project.urls]
Repository = "https://github.com/taiwuchiang-gmail/hierarchical-pca-search"
"Paper I (Zenodo)" = "https://doi.org/10.5281/zenodo.21387358"

[tool.setuptools]
py-modules = ["hybrid_search", "diagnose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
